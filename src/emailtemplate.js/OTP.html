<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verify Your Email</title>

<body style="margin:0;padding:0;background:#050505;font-family:Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center">

<table width="600" cellpadding="0" cellspacing="0" style="
margin:40px auto;
background:#0a0a0a;
border-radius:24px;
border:1px solid #1e1e1e;
overflow:hidden;
">

<tr>
<td align="center" style="padding:50px 40px;">

color:white;
font-size:36px;

LedgerAI

color:#b0b0b0;

</td>
</tr>

<tr>
<td align="center" style="padding:20px 40px;">

<div style="
display:inline-block;
padding:25px 40px;
background:linear-gradient(135deg,#8b5cf6,#c084fc);

">

<div style="
background:#050505;
border-radius:16px;
padding:20px 40px;
">

font-size:42px;
font-weight:bold;
letter-spacing:12px;

">

</div>

</div>

<p style="
margin-top:30px;
color:#b0b0b0;
line-height:1.8;
">

</p>

<p style="
color:#808080;
font-size:14px;
line-height:1.7;
">

you can safely ignore this email.
</p>

</td>
</tr>

<tr>
<td style="
padding:30px;

font-size:13px;

">

</table>

</td>
</tr>
